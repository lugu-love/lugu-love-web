<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6efe3">
  <title>世界生命空间展馆｜生命空间</title>
  <link rel="icon" href="../assets/icons/lugu-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/social.css">
  <style>
    .explore-nav{min-height:54px;display:flex;align-items:center;justify-content:space-between}.explore-hero{padding:34px 4px 28px}.explore-hero h1{margin:0 0 11px;font:600 32px/1.25 Georgia,"Songti SC",serif}.explore-hero>p:last-child{margin:0;color:var(--muted);line-height:1.7}.space-directory{display:grid;gap:14px}.space-card{display:grid;grid-template-columns:58px 1fr auto;gap:14px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:22px;background:rgba(255,253,248,.9);box-shadow:0 8px 24px rgba(68,62,49,.05)}.space-avatar{width:58px;height:58px;display:grid;place-items:center;overflow:hidden;border-radius:50%;color:#fff;font:600 23px Georgia,serif;background:linear-gradient(145deg,#879b7a,#52664d)}.space-avatar img{width:100%;height:100%;object-fit:cover}.space-copy{min-width:0}.space-copy h2{margin:0 0 5px;font-size:17px}.space-copy p{margin:0;overflow:hidden;color:var(--muted);font-size:12px;text-overflow:ellipsis;white-space:nowrap}.space-id{display:block;margin-top:7px;color:#9a9b93;font-size:9px}.space-actions{display:grid;gap:7px}.space-actions a,.space-actions button{min-height:38px;padding:0 12px;border:0;border-radius:12px;white-space:nowrap}.space-actions a{display:flex;align-items:center;color:#fff;background:var(--sage-dark)}.space-actions button{color:var(--sage-dark);background:#e9eee4}.space-actions button.active{color:#fff;background:#819276}@media(max-width:520px){.space-card{grid-template-columns:50px 1fr}.space-avatar{width:50px;height:50px}.space-actions{grid-column:1/-1;grid-template-columns:1fr 1fr}.space-actions a,.space-actions button{justify-content:center}}
  </style>
</head>
<body>
  <main class="page-shell">
    <nav class="explore-nav"><a href="index.html">← 我的空间</a><a href="notifications.html">通知</a></nav>
    <header class="explore-hero"><p class="eyebrow">EXPLORE LIFE SPACES</p><h1>世界生命空间展馆</h1><p>进入一个人的空间，阅读 TA 愿意公开的生命记录。</p></header>
    <section class="space-directory" id="spaceDirectory"></section>
  </main>
  <div class="notice" id="notice" role="status" aria-live="polite"></div>
  <script src="data/default-data.js?v=20260726-2"></script>
  <script src="js/storage.js?v=20260726-3"></script>
  <script src="js/data/local-adapter.js?v=20260726-2"></script>
  <script src="js/data/data-service.js?v=20260726-2"></script>
  <script src="js/explore.js?v=20260726-2"></script>
</body>
</html>
