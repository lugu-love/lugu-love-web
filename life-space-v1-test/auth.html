<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6efe3">
  <title>登录｜生命空间</title>
  <link rel="icon" href="../assets/icons/lugu-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/social.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-brand">
      <span class="auth-star" aria-hidden="true">✦</span>
      <p class="eyebrow">LIFE SPACE</p>
      <h1>让每段生命，<br>都有自己的空间</h1>
      <p>保存照片、文字、音乐和故事，也在彼此的回应中看见连接。</p>
    </section>
    <section class="auth-card">
      <div class="auth-tabs" role="tablist">
        <button class="active" type="button" data-auth-mode="login">登录</button>
        <button type="button" data-auth-mode="register">注册</button>
      </div>
      <form id="authForm">
        <label class="field auth-nickname" hidden><span>昵称</span><input id="authNickname" maxlength="12" placeholder="怎么称呼你"></label>
        <label class="field"><span>手机号</span><input id="authPhone" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="请输入 11 位手机号" required></label>
        <div class="code-row">
          <label class="field"><span>验证码</span><input id="authCode" inputmode="numeric" maxlength="6" placeholder="6 位验证码" required></label>
          <button id="sendCode" type="button">获取验证码</button>
        </div>
        <p class="auth-tip">V1 公网测试验证码为 <strong>123456</strong></p>
        <p class="auth-tip">公网体验测试版：数据仅保存在当前浏览器，不会跨设备同步；清除浏览器数据后会丢失。</p>
        <p class="form-message" id="authMessage" role="alert"></p>
        <button class="auth-submit" id="authSubmit" type="submit">登录并进入空间</button>
      </form>
      <button class="demo-login" id="demoLogin" type="button">使用演示账号进入</button>
    </section>
  </main>
  <script src="data/default-data.js?v=20260726-2"></script>
  <script src="js/storage.js?v=20260726-3"></script>
  <script src="js/data/local-adapter.js?v=20260726-2"></script>
  <script src="js/data/data-service.js?v=20260726-2"></script>
  <script src="js/auth.js?v=20260726-2"></script>
</body>
</html>
