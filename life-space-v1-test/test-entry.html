<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>生命空间本地测试入口</title>
  <link rel="icon" href="../assets/icons/lugu-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .test-shell{display:grid;align-content:center;gap:18px;min-height:100vh}
    .test-card{padding:28px;border-radius:28px;background:var(--paper);box-shadow:var(--shadow)}
    .test-card h1{margin:0 0 10px;font:600 28px/1.35 Georgia,"Songti SC",serif}
    .test-card p{margin:0;color:var(--muted);line-height:1.7}
    .test-links{display:grid;gap:12px}
    .test-link{min-height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-radius:17px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 18px rgba(68,62,49,.05)}
    .test-link.primary{color:#fff;background:var(--sage-dark)}
  </style>
</head>
<body>
  <main class="page-shell test-shell">
    <section class="test-card">
      <p class="eyebrow">Local Test</p>
      <h1>生命空间版本测试入口</h1>
      <p>三个入口彼此独立，仅用于本地验收，不会改变地球主页的正式按钮。</p>
    </section>
    <nav class="test-links" aria-label="版本测试入口">
      <a class="test-link" href="../index.html"><span>返回地球主页</span><span>→</span></a>
      <a class="test-link primary" href="index.html"><span>进入新版生命空间 V1</span><span>→</span></a>
      <a class="test-link" href="../my.html"><span>查看旧版我的空间</span><span>→</span></a>
    </nav>
  </main>
</body>
</html>
