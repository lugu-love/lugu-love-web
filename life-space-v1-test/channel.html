<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6efe3">
  <title>我的生活｜我的生命空间</title>
  <link rel="stylesheet" href="css/main.css?v=20260726-1">
  <link rel="stylesheet" href="css/channel.css?v=20260726-6">
  <link rel="stylesheet" href="css/life-card.css?v=20260726-2">
</head>
<body>
  <main class="page-shell channel-shell">
    <nav class="channel-nav">
      <div class="channel-back-links">
        <a class="earth-back-link" id="earthBackLink" href="../index.html" target="_top">← 返回地球</a>
        <a class="back-link" href="index.html" target="_top">空间主页</a>
      </div>
      <button class="my-music-button" id="openMusicPanel" type="button"><span aria-hidden="true">♫</span> 我的音乐</button>
    </nav>
    <section class="life-photo-frame" id="lifePhotoFrame" aria-label="我的生活相框">
      <div class="frame-photo-stage" id="framePhotoStage">
        <img id="framePhoto" alt="我的生活相框照片" hidden>
        <div class="frame-placeholder" id="framePlaceholder">
          <span>MY LIFE</span>
          <strong>放一张喜欢的照片</strong>
        </div>
      </div>
      <div class="frame-caption">
        <span>Life, framed with love</span>
        <button class="frame-edit-button" id="openFrameEditor" type="button">更换 · 调整</button>
      </div>
      <div class="frame-editor" id="frameEditor" hidden>
        <button class="frame-upload-button" id="chooseFramePhoto" type="button">选择照片</button>
        <input class="visually-hidden" id="framePhotoInput" type="file" accept="image/*">
        <label class="frame-zoom-control" for="framePhotoZoom"><span>缩放</span><input id="framePhotoZoom" type="range" min="100" max="240" value="100"></label>
        <p>在照片上拖动，可以调整画面位置。</p>
        <button class="frame-done-button" id="closeFrameEditor" type="button">完成</button>
      </div>
    </section>
    <header class="channel-header">
      <p class="eyebrow">Life Channel</p>
      <h1>我的生活</h1>
      <p>记录生活中平凡却值得留下的时刻。</p>
    </header>
    <section class="prompt-card" id="promptCard">
      <button class="prompt-background-button" id="changePromptBackground" type="button" aria-label="更换开始记录背景图">更换背景</button>
      <input class="visually-hidden" id="promptBackgroundInput" type="file" accept="image/*">
      <p>今天，有什么值得留下？</p>
      <a class="prompt-record-button" href="editor.html?module=life"><span aria-hidden="true">＋</span> 开始记录</a>
    </section>
    <section aria-labelledby="recordsTitle">
      <div class="list-heading"><h2 id="recordsTitle">生活记录</h2><span class="record-count" id="recordCount">0 条</span></div>
      <div class="card-list" id="cardList"></div>
    </section>
  </main>

  <div class="notice" id="notice" role="status" aria-live="polite"></div>
  <div class="detail-backdrop" id="detailBackdrop" aria-hidden="true">
    <article class="detail-panel" id="detailPanel"></article>
  </div>
  <div class="image-viewer" id="imageViewer" aria-hidden="true">
    <button class="viewer-close" id="viewerClose" type="button" aria-label="关闭高清图片">×</button>
    <button class="viewer-nav viewer-prev" id="viewerPrev" type="button" aria-label="上一张">‹</button>
    <img id="viewerImage" alt="生命记录高清图片">
    <button class="viewer-nav viewer-next" id="viewerNext" type="button" aria-label="下一张">›</button>
    <div class="viewer-count" id="viewerCount"></div>
  </div>
  <div class="music-backdrop" id="musicBackdrop" aria-hidden="true">
    <section class="music-panel" role="dialog" aria-modal="true" aria-labelledby="musicPanelTitle">
      <header>
        <div><p>Life Soundtrack</p><h2 id="musicPanelTitle">我的音乐</h2></div>
        <button class="music-close" id="closeMusicPanel" type="button" aria-label="关闭我的音乐">×</button>
      </header>
      <label class="music-field" for="musicSelect">
        <span>选择音乐</span>
        <select id="musicSelect"><option value="">尚未添加音乐</option></select>
      </label>
      <label class="music-upload-button" for="musicInput">＋ 从设备添加音乐</label>
      <input class="visually-hidden" id="musicInput" type="file" accept="audio/*">
      <div class="music-control-row">
        <div><strong>音乐开关</strong><small id="musicStatus">当前已关闭</small></div>
        <label class="music-switch">
          <input id="musicEnabled" type="checkbox">
          <span aria-hidden="true"></span>
          <b>播放背景音乐</b>
        </label>
      </div>
      <label class="music-volume" for="musicVolume">
        <span>音量</span>
        <input id="musicVolume" type="range" min="0" max="100" step="1" value="45">
        <output id="musicVolumeValue">45%</output>
      </label>
      <p class="music-tip">音乐只保存在当前设备中。首次播放需要点击一次音乐开关。</p>
    </section>
  </div>
  <audio id="backgroundMusic" loop preload="metadata"></audio>
  <script src="data/default-data.js?v=20260726-2"></script>
  <script src="data/demo-visitors.js?v=20260726-1"></script>
  <script src="js/image-storage.js"></script>
  <script src="js/storage.js?v=20260726-3"></script>
  <script src="js/data/local-adapter.js?v=20260726-2"></script>
  <script src="js/data/data-service.js?v=20260726-2"></script>
  <script src="js/life-card-renderer.js?v=20260726-5"></script>
  <script src="js/channel.js?v=20260726-10"></script>
</body>
</html>
