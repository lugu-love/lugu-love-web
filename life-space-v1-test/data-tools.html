<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6efe3">
  <title>本地数据工具｜生命空间开发工具</title>
  <link rel="icon" href="../assets/icons/lugu-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .tools-shell{width:min(100%,720px);margin:auto;padding:max(24px,env(safe-area-inset-top)) 16px 40px}.tools-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.tools-nav a{color:var(--sage-dark)}.tools-header{padding:24px;border-radius:24px;background:#fffdf8;box-shadow:var(--shadow)}.tools-header h1{margin:0 0 10px;font:600 28px Georgia,"Songti SC",serif}.tools-header p{margin:0;color:var(--muted);line-height:1.7}.tool-card{margin-top:14px;padding:20px;border:1px solid var(--line);border-radius:22px;background:rgba(255,253,248,.9)}.tool-card h2{margin:0 0 8px;font-size:18px}.tool-card p{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.65}.tool-button,.file-button{min-height:46px;display:inline-flex;align-items:center;justify-content:center;padding:0 17px;border:0;border-radius:14px;color:#fff;font-weight:650;background:var(--sage-dark);cursor:pointer}.file-button input{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.tool-button.secondary{color:var(--sage-dark);background:#e8ede3}.tool-button.danger{background:#a6534d}.import-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.statistics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.statistics div{padding:10px 5px;border-radius:12px;text-align:center;background:#f1eee6}.statistics strong,.statistics span{display:block}.statistics span{margin-top:3px;color:var(--muted);font-size:10px}.tool-status{min-height:48px;margin-top:16px;padding:14px;border-radius:14px;background:#ece9e1}.tool-status[data-type=success]{color:#315d3d;background:#e4f0e3}.tool-status[data-type=error]{color:#8a3833;background:#f5e2df}@media(max-width:420px){.statistics{grid-template-columns:repeat(2,1fr)}.tool-button,.file-button{width:100%}.import-actions{display:grid}}
  </style>
</head>
<body>
  <main class="tools-shell">
    <nav class="tools-nav"><a href="auth.html">← 返回登录页</a><span>仅限开发与迁移</span></nav>
    <header class="tools-header"><p class="eyebrow">LOCAL DATA TOOL</p><h1>本地数据备份与恢复</h1><p>此页面不在正式用户流程中。导出文件可能包含手机号、用户资料和私人媒体，请妥善保存。</p></header>
    <section class="tool-card"><h2>导出当前项目数据</h2><p>导出全部 life-space-v1 localStorage 数据和 IndexedDB 媒体 Blob。</p><button class="tool-button" id="exportData" type="button">导出 JSON 备份</button></section>
    <section class="tool-card"><h2>导入恢复</h2><p>选择备份后先检查版本并显示统计，再选择完全覆盖或按 ID 合并。</p><label class="file-button">选择备份文件<input id="importFile" type="file" accept=".json,application/json"></label><div id="importActions" hidden><p id="importSummary"></p><div class="import-actions"><button class="tool-button danger" id="replaceImport" type="button">完全覆盖恢复</button><button class="tool-button secondary" id="mergeImport" type="button">合并导入</button></div></div></section>
    <section class="tool-card"><h2>清空项目数据</h2><p>仅清理当前来源中以 life-space-v1 开头的数据和项目媒体数据库，需要连续确认两次。</p><button class="tool-button danger" id="clearData" type="button">清空 life-space-v1 数据</button></section>
    <section class="statistics" id="statistics" hidden></section>
    <div class="tool-status" id="toolStatus" role="status" aria-live="polite">尚未执行操作。</div>
  </main>
  <script src="data/default-data.js?v=20260726-2"></script>
  <script src="js/image-storage.js?v=20260726-1"></script>
  <script src="js/storage.js?v=20260726-3"></script>
  <script src="js/data/local-adapter.js?v=20260726-2"></script>
  <script src="js/data/data-service.js?v=20260726-2"></script>
  <script src="js/data/data-backup.js?v=20260726-2"></script>
  <script src="js/data/data-tools.js?v=20260726-2"></script>
</body>
</html>
